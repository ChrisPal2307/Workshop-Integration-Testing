name: CI - maycolmont

on:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Ejecutar suite completa
        run: python -m pytest -q
